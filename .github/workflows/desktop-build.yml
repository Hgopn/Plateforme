name: Desktop build preview

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Approved public HTTPS backend origin"
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            command: dist:win
            artifact: interarcade-windows-unsigned
          - os: macos-latest
            command: dist:mac
            artifact: interarcade-mac-unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Check main process
        working-directory: desktop
        run: npm run check
      - name: Configure backend address
        working-directory: desktop
        env:
          INTERARCADE_SERVER_URL: ${{ inputs.server_url }}
          INTERARCADE_BUILD_CHANNEL: production
        run: npm run configure:server
      - name: Build unsigned preview
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        run: npm run ${{ matrix.command }}
      - name: Build unsigned Mac preview
        if: matrix.os == 'macos-latest'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac -- -c.mac.hardenedRuntime=false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/dist/*
          if-no-files-found: error
