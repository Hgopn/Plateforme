name: Desktop build preview

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Approved public HTTPS backend origin"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Unsigned ${{ matrix.os }} package
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - os: windows-2022
            command: dist:win
            artifact: interarcade-windows-unsigned
          - os: macos-15
            command: dist:mac
            artifact: interarcade-mac-arm64-unsigned
          - os: macos-15-intel
            command: dist:mac
            artifact: interarcade-mac-x64-unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Check main process
        working-directory: desktop
        run: npm run check
      - name: Check desktop security contract
        working-directory: desktop
        run: node ../tests/test_desktop_security.js
      - name: Block high and critical npm advisories
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Configure backend address
        working-directory: desktop
        env:
          INTERARCADE_SERVER_URL: ${{ inputs.server_url }}
          INTERARCADE_BUILD_CHANNEL: production
        run: npm run configure:server
      - name: Build unsigned preview
        if: matrix.os == 'windows-2022'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.command }}
      - name: Build unsigned Mac preview
        if: startsWith(matrix.os, 'macos-')
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac -- -c.mac.hardenedRuntime=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 7
